[package]
name = "wizdraw"
version = "2.3.0"
edition = "2021"
authors = [ "Nathan ROYER <nathan.royer.pro@gmail.com>" ]
description = "Portable crate to fill (and stroke) paths"
license = "MIT"
keywords = [ "vector-graphics", "render", "svg", "no_std" ]
repository = "https://github.com/NathanRoyer/wizdraw"
categories = [ "rendering", "no-std" ]

[dependencies]

# required:
vek = { version = "0.17", default-features = false, features = [ "libm" ] }
rgb = { version = "0.8", features = [ "bytemuck" ] }

# optional:
ttf-parser = { version = "0.25", optional = true } # features: text
litemap = { version = "0.8", optional = true } # features: text
glow = { version = "0.17", optional = true } # features: gles2

[features]
default = [ "text", "shapes" ]
gles2 = [ "dep:glow", "std" ]
text = [ "dep:ttf-parser", "dep:litemap" ]
shapes = []
std = []

[dev-dependencies]
png = "0.17"
khronos-egl = { version = "6.0", features = ["dynamic"] }
libloading = "0.8"

[package.metadata.docs.rs]
features = [ "gles2" ]
