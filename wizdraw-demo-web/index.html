<!DOCTYPE html>
<html>
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
        <style type="text/css">
html, body, canvas {
    position: absolute;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    left: 0;
    top: 0;
    overflow: hidden;
    background-color: #acc;
}

canvas {
    z-index: 0;
}

.hide { display: none; }
        </style>
    </head>
    <body>
        <canvas id="cpu-canvas"></canvas>
        <canvas id="gpu-canvas"></canvas>
        <script type="module">
            import init, { frame } from './wizdraw_demo_web.js';

            let running = true;
            let cpu = true;
            let x = 0.0;
            let y = 0.0;

            let samples = [];

            function update_frame() {
                let cpu_canvas = document.getElementById('cpu-canvas');
                let gpu_canvas = document.getElementById('gpu-canvas');

                if (running) {
                    (cpu ? gpu_canvas : cpu_canvas).classList.add('hide');
                    (cpu ? cpu_canvas : gpu_canvas).classList.remove('hide');

                    let startTime = performance.now();
                    frame(x, y, cpu);
                    let endTime = performance.now();
                    let fps = 1000 / (endTime - startTime);
                    samples.push(fps);

                    if (samples.length >= 10) {
                        let renderer = cpu ? "CPU" : "GPU";
                        let fps_sum = samples.reduce((a, b) => a + b);
                        let avg_fps = Math.round(fps_sum / samples.length);
                        document.title = avg_fps.toString() + ' FPS (' + renderer + ')';
                        samples = [];
                    }
                }

                setTimeout(update_frame, 16);
            }

            async function run() {
                await init();

                document.body.addEventListener('click', () => cpu = !cpu);
                document.body.addEventListener('mousemove', e => {
                    x = e.clientX;
                    y = e.clientY;
                });

                update_frame();
            }

            run();
        </script>
    </body>
</html>
